<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haloeth 远程</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #17181c;
    --panel: #1f2026;
    --border: #33353d;
    --text: #e8e8ea;
    --muted: #9a9ca6;
    --accent: #6ea8fe;
    --success: #6fcf97;
    --danger: #eb5757;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header strong { font-size: 15px; }
  #status { color: var(--muted); font-size: 13px; }
  #usage { margin-left: auto; color: var(--muted); font-size: 12px; }
  #sessions {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 6px;
    max-width: 46vw;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row { white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #24344f; border-radius: 10px; padding: 8px 10px; max-width: 88%; }
  .assistant { align-self: flex-start; background: var(--panel); border-radius: 10px; padding: 8px 10px; max-width: 88%; }
  .notice { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; }
  .card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    background: var(--panel);
  }
  .card .title { font-weight: 600; }
  .card .detail { color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .thinking .detail { font-style: italic; color: #8f8f99; }
  .approval { border-color: #5c4a1e; }
  .approval .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .approval button {
    background: #2a2b31;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .approval button.allow { border-color: #2f6b47; color: var(--success); }
  .approval button.deny { border-color: #6b2f2f; color: var(--danger); }
  main img { max-width: 100%; border-radius: 8px; }
  footer {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    align-items: flex-end;
    flex-wrap: wrap;
  }
  #input {
    flex: 1;
    min-width: 50vw;
    resize: vertical;
    min-height: 44px;
    max-height: 30vh;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font: inherit;
  }
  footer button {
    background: var(--accent);
    color: #10131a;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 600;
  }
  footer button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 400; }
  footer button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <strong id="title">Haloeth 远程</strong>
  <span id="status">未连接</span>
  <select id="sessions" aria-label="会话"></select>
  <span id="usage"></span>
</header>
<main id="transcript"></main>
<footer>
  <textarea id="input" placeholder="描述你要完成的任务…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
  <button id="cancel" class="ghost">停止</button>
  <button id="new-session" class="ghost">新会话</button>
</footer>
<script>
(() => {
  'use strict';

  // 状态文案与协议规范第 7 节一致。
  const STATUS = {
    idle: '就绪', preparing: '准备中', running: '运行中',
    awaiting_approval: '等待确认', cancelling: '正在取消',
    unconfigured: '未配置密钥', unselected: '未选择模型', failed: '运行失败',
  };
  const ACTIVE = {
    running: '运行中', ok: '完成', failed: '失败',
    pending: '等待确认', allowed: '已允许', denied: '已拒绝', interrupted: '已中断',
  };

  const state = {
    ws: null, nextId: 0, cursor: -1, pending: new Map(),
    token: null, streaming: null, thinking: null,
    activities: new Map(), approvals: new Map(), closing: false,
  };

  const transcript = document.getElementById('transcript');
  const statusEl = document.getElementById('status');
  const usageEl = document.getElementById('usage');
  const titleEl = document.getElementById('title');
  const sessionsEl = document.getElementById('sessions');
  const input = document.getElementById('input');
  const sendButton = document.getElementById('send');

  function setStatus(text) { statusEl.textContent = text; }
  function append(className, text) {
    const el = document.createElement('div');
    el.className = className;
    if (text !== undefined) el.textContent = text;
    transcript.appendChild(el);
    transcript.scrollTop = transcript.scrollHeight;
    return el;
  }
  function notice(text) { append('notice', text); }
  function failure(text) { append('error', text); }

  function request(op, params) {
    return new Promise((resolve, reject) => {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        reject({ code: 'closed', message: '连接已关闭' });
        return;
      }
      const id = ++state.nextId;
      state.pending.set(id, { resolve, reject });
      state.ws.send(JSON.stringify({ v: 1, id, op, params: params || {} }));
    });
  }

  function connect() {
    const token = new URLSearchParams(location.search).get('token')
      || sessionStorage.getItem('haloeth-token')
      || window.prompt('输入配对令牌');
    if (!token) { setStatus('未提供令牌'); return; }
    state.token = token;
    sessionStorage.setItem('haloeth-token', token);

    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${scheme}://${location.host}/v1`);
    state.ws = ws;
    setStatus('连接中…');

    ws.onopen = async () => {
      setStatus('鉴权中…');
      try {
        const welcome = await request('hello', {
          token,
          client: { name: 'haloeth-web', version: '1' },
        });
        titleEl.textContent = welcome.state.title || 'Haloeth 远程';
        if (welcome.sessions) renderSessions(welcome.sessions);
        applyState(welcome.state);
        setStatus('已连接');
      } catch (error) {
        setStatus(`鉴权失败：${error.message || error.code}`);
        ws.close();
      }
    };

    ws.onmessage = (event) => {
      let frame;
      try { frame = JSON.parse(event.data); } catch { return; }
      if (frame.id !== undefined) {
        const entry = state.pending.get(frame.id);
        if (!entry) return;
        state.pending.delete(frame.id);
        if (frame.ok) entry.resolve(frame.result);
        else entry.reject(frame.error || { code: 'internal', message: '未知错误' });
        return;
      }
      if (typeof frame.seq === 'number' && frame.seq <= state.cursor) return;
      if (typeof frame.seq === 'number') state.cursor = frame.seq;
      handle(frame.op, frame.params || {});
    };

    ws.onclose = () => {
      setStatus(state.closing ? '连接已关闭' : '连接断开');
      sendButton.disabled = true;
      input.disabled = true;
    };
    ws.onerror = () => setStatus('连接错误');
  }

  function handle(op, params) {
    switch (op) {
      case 'transcript.reset': resetTranscript(params); break;
      case 'message.appended': closeStreaming(); closeThinking();
        append(params.role === 'user' ? 'row user' : 'row assistant', params.text); break;
      case 'message.delta': streamText(params.text); break;
      case 'message.completed': closeStreaming(); closeThinking();
        if (params.text) append('row assistant', params.text); break;
      case 'reasoning.delta': thinkingDelta(params.text); break;
      case 'tool.started': closeStreaming(); closeThinking(); toolStarted(params); break;
      case 'tool.finished': toolFinished(params); break;
      case 'approval.requested': approvalRequested(params); break;
      case 'approval.resolved': approvalResolved(params); break;
      case 'images.appended': (params.items || []).forEach(item => addImage(item)); break;
      case 'plan.appended': card('card', '计划', params.text); break;
      case 'status.changed': setStatus(statusText(params)); break;
      case 'usage.changed': usageEl.textContent = `输入 ${params.total.input} / 输出 ${params.total.output}`; break;
      case 'sessions.changed': renderSessions(params.summaries || []); break;
      case 'state.changed': applyState(params.state); break;
      case 'shutdown': state.closing = true; setStatus(`服务已停止：${params.reason || ''}`); break;
      default: break;
    }
  }

  function statusText(params) {
    const label = STATUS[params.status] || params.status;
    return params.activity ? `${label} · ${params.activity}` : label;
  }

  function applyState(s) {
    if (!s) return;
    titleEl.textContent = s.title || titleEl.textContent;
    setStatus(statusText(s));
    if (s.selection) titleEl.title = `${s.selection.provider} / ${s.selection.model}`;
    if (s.usage) usageEl.textContent = `输入 ${s.usage.total.input} / 输出 ${s.usage.total.output}`;
    if (s.active_session_id) sessionsEl.value = s.active_session_id;
  }

  function renderSessions(summaries) {
    sessionsEl.innerHTML = '';
    for (const summary of summaries) {
      const option = document.createElement('option');
      option.value = summary.id;
      option.textContent = `${summary.title}（${summary.message_count}）`;
      sessionsEl.appendChild(option);
    }
  }

  function closeStreaming() { state.streaming = null; }
  function streamText(text) {
    if (!state.streaming) {
      const el = document.createElement('div');
      el.className = 'row assistant';
      transcript.appendChild(el);
      state.streaming = el;
    }
    state.streaming.textContent += text;
    transcript.scrollTop = transcript.scrollHeight;
  }

  function closeThinking() { state.thinking = null; }
  function thinkingDelta(text) {
    if (!state.thinking) {
      const el = card('card thinking', '思考过程', '');
      state.thinking = el.querySelector('.detail');
    }
    state.thinking.textContent += text;
    transcript.scrollTop = transcript.scrollHeight;
  }

  function card(className, title, detail) {
    const el = document.createElement('div');
    el.className = className;
    const heading = document.createElement('div');
    heading.className = 'title';
    heading.textContent = title;
    el.appendChild(heading);
    const body = document.createElement('div');
    body.className = 'detail';
    body.textContent = detail || '';
    el.appendChild(body);
    const meta = document.createElement('div');
    meta.className = 'meta';
    el.appendChild(meta);
    transcript.appendChild(el);
    transcript.scrollTop = transcript.scrollHeight;
    return el;
  }

  function toolStarted(params) {
    const el = card('card', `调用 ${params.name}`, params.arguments || '');
    el.querySelector('.meta').textContent = '运行中…';
    state.activities.set(params.call_id, el);
  }
  function toolFinished(params) {
    const el = state.activities.get(params.call_id);
    if (!el) return;
    el.querySelector('.meta').textContent =
      `${ACTIVE[params.ok ? 'ok' : 'failed']} · ${params.elapsed_ms} ms · ${params.preview || ''}`;
  }

  function approvalRequested(params) {
    const el = card('card approval', `需要确认：${params.summary}`,
      `${params.tool} · 风险 ${params.risk}${params.manual ? '' : ' · 审核模型判定中'}`);
    const actions = document.createElement('div');
    actions.className = 'actions';
    const decide = (decision) => {
      request('approval.resolve', { id: params.id, decision })
        .catch(error => failure(`审批失败：${error.message || error.code}`));
    };
    const allow = document.createElement('button');
    allow.className = 'allow';
    allow.textContent = '允许一次';
    allow.onclick = () => decide('allow_once');
    const always = document.createElement('button');
    always.className = 'allow';
    always.textContent = '始终允许';
    always.onclick = () => decide('allow_always');
    const deny = document.createElement('button');
    deny.className = 'deny';
    deny.textContent = '拒绝';
    deny.onclick = () => decide('deny');
    actions.append(allow, always, deny);
    el.appendChild(actions);
    state.approvals.set(params.id, el);
  }
  function approvalResolved(params) {
    const el = state.approvals.get(params.id);
    if (!el) return;
    const actions = el.querySelector('.actions');
    if (actions) actions.remove();
    el.querySelector('.meta').textContent =
      `已处理：${params.decision}${params.reason ? ` · ${params.reason}` : ''}`;
  }

  function addImage(item) {
    const img = document.createElement('img');
    img.alt = item.caption || '图片';
    img.src = `/v1/assets?path=${encodeURIComponent(item.path)}&token=${encodeURIComponent(state.token || '')}`;
    transcript.appendChild(img);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function resetTranscript(params) {
    transcript.innerHTML = '';
    state.activities.clear();
    state.approvals.clear();
    state.streaming = null;
    state.thinking = null;
    for (const entry of params.entries || []) {
      if (entry.type === 'text') {
        append(entry.role === 'user' ? 'row user' : 'row assistant', entry.text);
      } else if (entry.type === 'activity') {
        const el = card('card', entry.title, entry.detail);
        el.querySelector('.meta').textContent =
          `${ACTIVE[entry.status] || entry.status}${entry.preview ? ` · ${entry.preview}` : ''}`;
        if (entry.id) state.activities.set(entry.id, el);
      } else if (entry.type === 'image') {
        addImage(entry);
      }
    }
    if (params.streaming) {
      const el = document.createElement('div');
      el.className = 'row assistant';
      el.textContent = params.streaming.text;
      transcript.appendChild(el);
      state.streaming = el;
    }
    transcript.scrollTop = transcript.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      await request('message.send', { text });
    } catch (error) {
      if (error.code === 'busy') {
        input.value = (error.data && error.data.text) || text;
        setStatus('运行中，无法发送');
      } else {
        failure(`发送失败：${error.message || error.code}`);
      }
    }
  }

  document.getElementById('send').onclick = sendMessage;
  document.getElementById('cancel').onclick = () => {
    request('run.cancel').catch(error => failure(`取消失败：${error.message || error.code}`));
  };
  document.getElementById('new-session').onclick = () => {
    request('session.new').catch(error => failure(`新建失败：${error.message || error.code}`));
  };
  sessionsEl.onchange = () => {
    request('session.open', { id: sessionsEl.value })
      .catch(error => failure(`切换失败：${error.message || error.code}`));
  };
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  connect();
})();
</script>
</body>
</html>

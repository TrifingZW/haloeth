[workspace]
resolver = "3"
members = ["agent"]

[workspace.package]
version = "0.1.0"
authors = ["TrifingZW <email@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "haloeth"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[workspace.dependencies]
tokio = "1.54.1"
reqwest = "0.13.5"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dependencies]
agent = { path = "agent" }
chrono = "0.4.45"
directories = "6.0.0"
rfd = "0.18.0"
gpui-kit = "0.9.1"
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
toml.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1.92"
gpui-kit = { version = "0.9.1", features = ["test-support"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
split-debuginfo = "off"
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

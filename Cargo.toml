[workspace]
members = ["agent", "remote"]
resolver = "3"

[workspace.package]
authors = ["TrifingZW <email@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3.31"
gpui-kit = "0.10.0"
rcgen = "0.13"
reqwest = "0.13.5"
rmcp = { version = "3.10.0", default-features = false }
rustls = "0.23"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = "1.54.1"
tokio-tungstenite = "0.29"
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[package]
name = "haloeth"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
agent = { path = "agent" }
async-trait.workspace = true
chrono = "0.4.45"
cpal = "0.15.3"
directories = "6.0.0"
gpui-kit = { workspace = true, features = ["speech"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
qrcode = { version = "0.14.1", default-features = false }
remote = { path = "remote" }
reqwest = { workspace = true, features = ["blocking", "multipart"] }
rfd = "0.18.0"
serde.workspace = true
serde_json.workspace = true
smallvec = "1.16.5"
smol = "2.0.2"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[workspace]
resolver = "3"
members = ["agent"]

[workspace.package]
version = "0.1.0"
authors = ["TrifingZW <email@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "haloeth"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[workspace.dependencies]
tokio = "1.54.1"
reqwest = "0.13.5"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dependencies]
agent = { path = "agent" }
gpui-kit = "0.9.1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
toml.workspace = true

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
split-debuginfo = "off"
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

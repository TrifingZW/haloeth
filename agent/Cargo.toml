[package]
name = "agent"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
content_inspector = "0.2.4"
dunce = "1.0.5"
http = "1"
reqwest.workspace = true
rmcp = { workspace = true, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
scraper = "0.29.0"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
shell-words = "1.1.1"
tokio = { workspace = true, features = ["io-util", "macros", "process", "sync", "time"] }
tokio-util = "0.7.20"
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw"] }
tokio = { workspace = true, features = ["macros", "rt"] }
